databases:
  - name: smartdine-db
    databaseName: smartdine
    user: smartdine
    plan: free
    region: singapore

services:
  - type: web
    name: whiterose-smartdine
    runtime: node
    plan: free
    region: singapore
    # --include=dev matters: Next.js needs tailwindcss/postcss and the Prisma CLI at build time.
    # Never set NODE_ENV=production here, or `npm ci` will skip those devDependencies and the build fails.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartdine-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      # Demo mode shows the demo logins on /login and table links on /. Set to "false" for a real restaurant.
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      # Set this after the first deploy to the live URL, e.g. https://whiterose-smartdine.onrender.com
      # It is baked into every QR code, so changing it requires re-printing the table cards.
      - key: PUBLIC_BASE_URL
        sync: false
    # Uploaded menu photos live on local disk. Uncomment to keep them across deploys
    # (Render disks need a paid instance type).
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/uploads
    #   sizeGB: 1
#
# Demo data: Render's one-off jobs need a paid instance, so seed once by temporarily adding
#   npx tsx prisma/seed.ts --force &&
# to the build command, letting that deploy finish, then removing it. The database is separate
# from the web service, so the seeded rows survive later deploys.
